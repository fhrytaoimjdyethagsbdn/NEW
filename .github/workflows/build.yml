name: Build PSY - ZUMBO (Windows VST3)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup JUCE Framework
        shell: pwsh
        run: |
          git clone --depth 1 --branch 7.0.7 https://github.com JUCE


      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DJUCE_ROOT=../JUCE

      - name: Build VST3 Plugin
        run: cmake --build build --config Release --parallel

      - name: Locate VST3 File
        shell: pwsh
        run: |
          $vst3Path = Get-ChildItem -Path . -Filter "*.vst3" -Recurse | Select-Object -First 1
          if ($vst3Path) {
              echo "FOUND_VST3=true" >> $env:GITHUB_ENV
              echo "VST3_DIR=$($vst3Path.DirectoryName)" >> $env:GITHUB_ENV
              Write-Host "Found VST3 at: $($vst3Path.FullName)"
          } else {
              echo "FOUND_VST3=false" >> $env:GITHUB_ENV
              Write-Error "Could not find any .vst3 file!"
          }

      - name: Upload Artifact
        if: env.FOUND_VST3 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PSY-ZUMBO-Windows-x64
          path: ${{ env.VST3_DIR }}
